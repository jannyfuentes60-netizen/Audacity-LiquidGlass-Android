name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        run: |
          flutter create --platforms=android --org com.djfaraon --project-name audacity_liquid_glass /tmp/audacity_android_scaffold
          mkdir -p android
          cp -R /tmp/audacity_android_scaffold/android/. android/

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: audacity-liquid-glass-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
