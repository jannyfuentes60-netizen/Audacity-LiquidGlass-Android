name: Audacity 4.0.2 Android (Andacious runtime)

"on":
  workflow_dispatch:
  push:
    branches: [port/andacious-audacity-4]
    paths:
      - "android/**"
      - "flutter/**"
      - ".github/workflows/audacity-android.yml"
      - ".gitmodules"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/audacity-android.yml"
      - ".gitmodules"

permissions:
  contents: read

jobs:
  build:
    name: Build Audacity 4 Android wrapper APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize Andacious Android compatibility layer
        run: git submodule update --init android/andacious

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Set up Flutter for the Liquid Glass library shell
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.0"
          channel: stable
          cache: true

      - name: Build Flutter library module AAR
        shell: bash
        run: |
          set -euo pipefail
          flutter create --template module --org tech.ula flutter_module
          # Keep Flutter's generated module manifest and its module metadata intact.
          cp -R flutter/lib/. flutter_module/lib/
          grep -q '^module:' flutter_module/pubspec.yaml
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("flutter_module/pubspec.yaml")
          source = manifest.read_text()
          needle = "  flutter:\\n    sdk: flutter\\n"
          additions = (
              "  cupertino_icons: ^1.0.8\\n"
              "  liquid_glass_widgets: ^1.17.3\\n"
              "  device_info_plus: ^12.3.0\\n"
              "  shared_preferences: ^2.5.3\\n"
          )
          if needle not in source:
              raise SystemExit("Generated Flutter module dependencies block changed; refusing to overwrite module metadata.")
          if "liquid_glass_widgets:" not in source:
              source = source.replace(needle, needle + additions, 1)
          manifest.write_text(source)
          PY
          cd flutter_module
          flutter pub get
          flutter build aar --debug

      - name: Prepare Andacious and replace its editor with Audacity 4.0.2
        run: |
          python3 android/prepare_andacious.py
          python3 android/integrate_flutter.py
          bash -n android/runtime/andacious.sh

      - name: Build the required ARM64 FreeRDP Gradle module
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget unzip patch
          export ANDROID_SDK="$ANDROID_HOME"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          cd android/andacious/UserLAndLibrary/remote-desktop-clients/remoteClientLib/jni/libs
          bash -n build-deps.sh
          ./build-deps.sh freerdp-only
          MODULE="deps/FreeRDP/client/Android/Studio/freeRDPCore"
          test -f "$MODULE/build.gradle"
          test -f "$MODULE/src/main/AndroidManifest.xml"
          test -d "$MODULE/src/main/jniLibs/arm64-v8a"
          find "$MODULE/src/main/jniLibs/arm64-v8a" -maxdepth 1 -type f -name '*.so' -print -quit | grep -q .
          # FreeRDPCore is generated by the legacy native build and has no compile SDK.
          # Add the same SDK level used by the Android wrapper before Gradle configures it.
          printf '\\nandroid {\\n    compileSdkVersion 35\\n}\\n' >> "$MODULE/build.gradle"
          grep -q "compileSdkVersion 35" "$MODULE/build.gradle"

      - name: Resolve dependency graphs for every included module
        working-directory: android/andacious
        run: |
          ./gradlew --no-daemon --stacktrace --continue \\
            :app:dependencies \\
            :UserLAndLibrary:dependencies \\
            :terminal-app:dependencies \\
            :terminal-view:dependencies \\
            :terminal-emulator:dependencies \\
            :bVNC:dependencies \\
            :pubkeyGenerator:dependencies \\
            :remoteClientLib:dependencies \\
            :remoteClientLib:jni:libs:deps:FreeRDP:client:Android:Studio:freeRDPCore:dependencies

      - name: Build Android APK
        working-directory: android/andacious
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Validate and stage APK
        shell: bash
        run: |
          APK="android/andacious/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ] || [ "$(stat -c%s "$APK")" -lt 1000000 ]; then
            echo "::error::A real Android APK was not produced."
            find android/andacious -path '*/build/outputs/*' -type f -print || true
            exit 1
          fi
          mkdir -p artifacts
          cp "$APK" artifacts/Audacity-4.0.2-Andacious-Android.apk
          ls -lh artifacts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Audacity-4.0.2-Andacious-Android
          path: artifacts/Audacity-4.0.2-Andacious-Android.apk
          if-no-files-found: error
          retention-days: 14
